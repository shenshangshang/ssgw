<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神殇AI网关</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
/* 设计系统（ui-ux-pro-max：Data-Dense Dashboard / Blue #1E40AF + Amber #D97706）*/
:root{
  --bg:#f8fafc; --panel:#ffffff; --border:#e2e8f0; --border-strong:#cbd5e1;
  --text:#0f172a; --muted:#64748b; --accent:#1e40af; --accent-hover:#1b3a9e; --accent-weak:#dbeafe;
  --accent2:#3b82f6; --highlight:#d97706;
  --ok:#047857; --ok-weak:#d1fae5; --warn:#b45309; --warn-weak:#fef3c7; --err:#b91c1c; --err-weak:#fee2e2;
  --radius:8px; --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 12px rgba(15,23,42,.05);
  --speed:.18s;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.layout{display:flex;min-height:100vh}
/* 侧栏 */
aside{width:216px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid var(--border)}
.brand-logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.brand-name{font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--muted)}
nav{flex:1;padding:10px 8px;overflow-y:auto}
nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;color:#475569;font-size:13.5px;margin-bottom:2px;transition:background var(--speed),color var(--speed)}
nav a:hover{background:#eef2f7;color:var(--text);text-decoration:none}
nav a.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
nav svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7}
.side-foot{border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;font-size:13px}
/* 主区 */
main{flex:1;margin-left:216px;padding:0 24px 32px;max-width:1400px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px}
.topbar h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
.topbar .actions{display:flex;gap:8px;align-items:center}
/* 卡片 */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.card-head{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head h2{font-size:14.5px;font-weight:600}
.card-body{padding:16px 18px}
.grid{display:grid;gap:14px}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
/* KPI */
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px 18px;box-shadow:var(--shadow);transition:border-color var(--speed)}
.kpi:hover{border-color:var(--border-strong)}
.kpi .label{color:var(--muted);font-size:12.5px;margin-bottom:8px}
.kpi .value{font-size:25px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:6px}
.bar{height:6px;border-radius:3px;background:#e8edf3;margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent2);border-radius:3px;transition:width .3s}
.bar>i.ok{background:var(--ok)}
/* 表格 */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
th{color:var(--muted);font-weight:600;background:#f8fafc;white-space:nowrap;font-size:12px;text-transform:none}
tbody tr{transition:background var(--speed)}
tbody tr:hover{background:#f1f5f9}
tbody tr:last-child td{border-bottom:0}
td{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.nowrap{white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:26px 0!important;font-size:13px}
.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:11.5px;background:#f1f5f9;color:#475569;line-height:19px;font-weight:500}
.tag+.tag{margin-left:4px}
.t-ok{background:var(--ok-weak);color:var(--ok)}
.t-warn{background:var(--warn-weak);color:var(--warn)}
.t-err{background:var(--err-weak);color:var(--err)}
.t-blue{background:var(--accent-weak);color:var(--accent)}
/* 控件 */
button{font-family:inherit;font-size:13px;border-radius:6px;border:1px solid var(--border-strong);background:var(--panel);
  color:var(--text);padding:6px 14px;cursor:pointer;transition:background var(--speed),border-color var(--speed),color var(--speed),box-shadow var(--speed);font-weight:500}
button:hover{border-color:var(--accent2);color:var(--accent);background:#f8fbff}
button:active{transform:translateY(0.5px)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}
button.link{border:0;background:none;color:var(--accent);padding:2px 6px}
button.link:hover{text-decoration:underline;background:none}
button.danger{color:var(--err)}
button.danger:hover{border-color:var(--err);color:var(--err);background:#fff8f8}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--border-strong);
  border-radius:6px;background:var(--panel);color:var(--text);width:100%;outline:none;transition:border-color var(--speed),box-shadow var(--speed)}
input:hover,select:hover,textarea:hover{border-color:#94a3b8}
input:focus,select:focus,textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
input[type=checkbox]{width:auto}
label.field{display:block;margin-bottom:13px}
label.field>span{display:block;font-size:12.5px;color:#475569;margin-bottom:5px;font-weight:500}
label.field>span b{color:var(--err);font-weight:400;margin-right:2px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:#f1f5f9;padding:1px 5px;border-radius:4px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:150px;max-width:280px}
/* switch */
.switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#c9d2dd;border-radius:22px;cursor:pointer;transition:.2s}
.slider:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider:before{transform:translateX(18px)}
.switch input:focus-visible+.slider{outline:2px solid var(--accent2);outline-offset:2px}
/* 抽屉/弹窗 */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:50;display:flex;justify-content:flex-end;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{width:min(680px,94vw);background:var(--panel);height:100%;overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.12);animation:slide .18s ease}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel);z-index:2}
.drawer-head h3{font-size:15px;font-weight:600}
.drawer-body{padding:20px}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--panel)}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;border-radius:0;color:var(--muted)}
.tabs button:hover{color:var(--text);background:none}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
/* 登录 */
#login{max-width:380px;margin:11vh auto}
#login .card-body{padding:26px 26px 22px}
#login h1{font-size:19px;text-align:center;margin-bottom:4px}
#login p.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
/* 分页 */
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
.pager .pages{display:flex;gap:6px;align-items:center}
.pager button{padding:4px 10px}
.pager button.active{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:500}
/* toast */
.toast-wrap{position:fixed;top:18px;right:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent2);border-radius:6px;
  padding:10px 16px;box-shadow:0 6px 20px rgba(15,23,42,.12);font-size:13px;max-width:360px;animation:slide .15s ease}
.toast.err{border-left-color:var(--err)}
.toast.ok{border-left-color:var(--ok)}
.disc-item{padding:8px 12px;font-size:12.5px;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--speed)}
.disc-item:last-child{border-bottom:0}
.disc-item:hover{background:var(--accent-weak);color:var(--accent)}
.empty{padding:44px;text-align:center;color:var(--muted);font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.chart-tip{position:fixed;z-index:99;background:#0f172a;color:#fff;border-radius:6px;padding:8px 12px;font-size:12px;line-height:1.7;pointer-events:none;display:none;box-shadow:0 4px 14px rgba(15,23,42,.3);white-space:nowrap}
.chart-legend{display:flex;gap:18px;justify-content:center;font-size:12.5px;color:#475569;margin-bottom:10px;flex-wrap:wrap}
.spark{display:flex;align-items:flex-end;gap:4px;height:60px;justify-content:center}
.spark i{flex:1 1 0;max-width:52px;background:var(--accent-weak);border-radius:3px 3px 0 0;min-height:3px;position:relative}
.spark i.on{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* 用户中心模型广场卡片 */
.uc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.uc-card{border:1px solid var(--border);border-radius:8px;padding:14px 16px;background:var(--panel);transition:box-shadow var(--speed),border-color var(--speed);cursor:default}
.uc-card:hover{border-color:#94a3b8;box-shadow:0 2px 10px rgba(15,23,42,.08)}
.uc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.uc-name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uc-ups{display:flex;flex-direction:column;gap:6px}
.uc-up{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}
.uc-un{color:var(--text);font-weight:500;white-space:nowrap}
.uc-mono{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.uc-dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1;flex:none}
.uc-dot.ok{background:var(--ok)}
.uc-dot.bad{background:var(--err)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f1f5f9;border-radius:4px;padding:3px 8px;font-size:12px}
.chip b{font-weight:500}
.chip .x{cursor:pointer;color:var(--muted);font-size:14px;line-height:1}
.chip .x:hover{color:var(--err)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toasts"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const state = { view: 'overview', csrf: '', user: null, drawer: null, page: {} };
const ICONS = {
  overview: '<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>',
  accounts: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
  groups: '<circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7 7.5l3 3M17 7.5l-3 3M7 16.5l3-3M17 16.5l-3-3"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.2 2.7-5.5 6-5.5s6 2.3 6 5.5"/><path d="M16 11a3 3 0 100-6M17.5 20c0-2.4-.8-4.2-2-5.4"/>',
  usergroups: '<path d="M4 20v-1.5A4.5 4.5 0 018.5 14h3A4.5 4.5 0 0116 18.5V20"/><circle cx="10" cy="8" r="3.4"/><path d="M17 14.2a4.5 4.5 0 013 4.3V20"/>',
  routing: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M6 8.5v3a3 3 0 003 3h1M18 8.5v3a3 3 0 01-3 3h-1"/>',
  keys: '<circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5L20 3M17 6l2 2M14.5 8.5l2 2"/>',
  logs: '<path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/>',
  usage: '<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',
  compliance: '<path d="M12 3l7 3v6c0 4-3 7.1-7 8-4-.9-7-4-7-8V6l7-3z"/><path d="M9 12l2 2 4-4"/>',
  audit: '<path d="M4 6h16M4 10h10M4 14h13M4 18h8"/><circle cx="18.5" cy="15.5" r="3.2"/>',
  usercenter: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/>',
  decisions: '<path d="M4 19V5"/><path d="M4 15l5-5 4 4 7-8"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 7l2.6 1.5M17.2 15.5L19.8 17M4.2 17l2.6-1.5M17.2 8.5L19.8 7"/>',
};
const NAV = [
  ['overview', '概览'], ['accounts', '上游账号'], ['groups', '模型'], ['users', '用户'],
  ['usergroups', '用户组'], ['routing', '智能路由'], ['decisions', '决策日志'], ['keys', 'API Keys'],
  ['logs', '调用日志'], ['usage', '用量统计'], ['settings', '设置'], ['usercenter', '用户中心'],
];
const FULL_NAV = NAV;

function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function copyText(t) {
  const done = () => toast('已复制');
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
  else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch { toast('复制失败', 'err'); }
  ta.remove();
}
function fmtNum(n) { n = Number(n || 0); return n >= 1e9 ? (n / 1e9).toFixed(1) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n); }
function fmtTime(s) { if (!s) return '-'; const d = new Date(s); return isNaN(d) ? '-' : d.toLocaleString('zh-CN', { hour12: false }); }
// 时长显示：>=1s 用秒（保留1位小数），否则用 ms
function fmtDur(ms) { ms = Number(ms || 0); if (!ms) return '-'; return ms >= 1000 ? (ms / 1000).toFixed(ms >= 10000 ? 0 : 1) + 's' : ms + 'ms'; }
function ago(ms) { if (!ms) return '-'; const d = Date.now() - Number(ms); return d < 60000 ? Math.floor(d / 1000) + 's 前' : d < 3600000 ? Math.floor(d / 60000) + 'm 前' : d < 86400000 ? Math.floor(d / 3600000) + 'h 前' : Math.floor(d / 86400000) + 'd 前'; }
const healthTag = (h) => h === 'available' ? '<span class="tag t-ok">健康</span>' : h === 'unavailable' ? '<span class="tag t-err">不可用</span>' : h === 'cooldown' ? '<span class="tag t-warn">冷却中</span>' : '<span class="tag">未知</span>';

async function api(method, path, body) {
  const res = await fetch('/api/v1' + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': state.csrf },
    credentials: 'same-origin',
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (res.status === 401) { state.user = null; state.view = 'login'; render(); throw new Error('请重新登录'); }
  const text = await res.text();
  let json = {}; try { json = text ? JSON.parse(text) : {}; } catch { json = { error: text.slice(0, 200) }; }
  if (!res.ok) throw new Error(json.error?.message || json.error || ('HTTP ' + res.status));
  return json;
}

function icon(name) { return `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`; }

async function render() {
  const app = $('#app');
  if (!state.user) {
    app.innerHTML = `<div id="login"><div class="card">
      <div class="card-body">
        <div style="text-align:center;margin-bottom:18px">
          <img src="/logo.svg" alt="logo" style="width:44px;height:44px;margin:0 auto 10px;display:block">
          <h1>神殇AI网关</h1><p class="sub">智能路由 / 降级 / 观测</p>
        </div>
        <label class="field"><span>用户名</span><input id="lu" value="admin" autocomplete="username"></label>
        <label class="field"><span>密码</span><input id="lp" type="password" autocomplete="current-password"></label>
        <button class="primary" style="width:100%;padding:9px" onclick="doLogin()">登 录</button>
        <div class="hint" style="text-align:center;margin-top:14px" id="lerr"></div>
      </div></div></div>`;
    $('#lp').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    return;
  }
  const isAdmin = state.user?.role === 'admin';
  const navItems = isAdmin ? FULL_NAV : [['usercenter', '用户中心']];
  if (!isAdmin && !navItems.some(([k]) => k === state.view)) state.view = 'usercenter';
  app.innerHTML = `<div class="layout">
    <aside>
      <div class="brand"><img src="/logo.svg" alt="logo" style="width:30px;height:30px;flex:none"><div><div class="brand-name">神殇AI网关</div><div class="brand-sub">Shenshang AI Gateway</div></div></div>
      <nav>${navItems.map(([k, n]) => `<a class="${state.view === k ? 'active' : ''}" onclick="go('${k}')">${icon(k)}<span>${n}</span></a>`).join('')}</nav>
      <div class="side-foot"><span>${esc(state.user.username)}</span><button class="link" onclick="doLogout()">退出</button></div>
    </aside>
    <main><div id="view"></div></main>
  </div>`;
  const v = $('#view');
  try {
    if (state.view === 'overview') await viewOverview(v);
    else if (state.view === 'accounts') await viewAccounts(v);
    else if (state.view === 'groups') await viewGroups(v);
    else if (state.view === 'users') await viewUsers(v);
    else if (state.view === 'usergroups') await viewUserGroups(v);
    else if (state.view === 'routing') await viewRouting(v);
    else if (state.view === 'keys') await viewKeys(v);
    else if (state.view === 'logs') await viewLogs(v);
    else if (state.view === 'usage') await viewUsage(v);
    else if (state.view === 'compliance') await viewCompliance(v);
    else if (state.view === 'audit') await viewAudit(v);
    else if (state.view === 'settings') await viewSettings(v);
    else if (state.view === 'decisions') await viewDecisions(v);
    else if (state.view === 'usercenter') await viewUserCenter(v);

// 多序列折线图（内联 SVG，无外部依赖）
function renderChart(el, rows, granularity) {
  if (!el) return;
  // 补全空桶到当前时间，避免"最后一格停在过去"
  if (rows && rows.length) {
    const full = [];
    if (granularity === 'hour') {
      const now = new Date(); now.setMinutes(0, 0, 0);
      let cur = new Date(rows[0].day + ':00');
      const map = new Map(rows.map(r => [r.day, r]));
      while (cur <= now) {
        const key = cur.toLocaleString('sv-SE', { hour12: false }).slice(0, 13) + ':00';
        full.push(map.get(key) || { day: key, calls: 0, ok: 0, input: 0, output: 0, tokens: 0, cached: 0, avgMs: 0 });
        cur = new Date(cur.getTime() + 3600000);
      }
    } else {
      const map = new Map(rows.map(r => [r.day, r]));
      const start = new Date(rows[0].day + 'T00:00:00');
      const today = new Date(); today.setHours(0, 0, 0, 0);
      let cur = start;
      while (cur <= today) {
        const key = cur.toLocaleString('sv-SE', { hour12: false }).slice(0, 10);
        full.push(map.get(key) || { day: key, calls: 0, ok: 0, input: 0, output: 0, tokens: 0, cached: 0, avgMs: 0 });
        cur = new Date(cur.getTime() + 86400000);
      }
    }
    if (full.length) rows = full;
  }
  if (!rows || !rows.length) { el.innerHTML = '<div class="empty">该时段暂无数据</div>'; return; }
  const W = el.clientWidth || 900, H = 240, PAD = { l: 56, r: 16, t: 12, b: 28 };
  const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b;
  const series = [
    { key: 'tokens', color: '#1c6ef2', fill: true },
    { key: 'input', color: '#4f9dff' },
    { key: 'output', color: '#ed7b2f' },
    { key: 'cached', color: '#00a870' },
  ];
  const max = Math.max(1, ...rows.map(r => r.tokens || 0));
  const step = rows.length > 1 ? iw / (rows.length - 1) : 0;
  const X = i => PAD.l + i * step;
  const Y = val => PAD.t + ih - (val / max) * ih;
  const lines = series.map(s => {
    const pts = rows.map((r, i) => `${X(i).toFixed(1)},${Y(r[s.key] || 0).toFixed(1)}`);
    const poly = `<polyline fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round" points="${pts.join(' ')}"/>`;
    const area = s.fill ? `<polygon fill="${s.color}" fill-opacity="0.08" points="${PAD.l},${Y(0)} ${pts.join(' ')} ${X(rows.length - 1).toFixed(1)},${Y(0)}"/>` : '';
    return area + poly;
  }).join('');
  // Y 轴刻度（4 档）+ X 轴时间标签（最多 6 个）
  const yTicks = [0, 0.5, 1].map(f => {
    const v = max * f, y = Y(v);
    return `<line x1="${PAD.l}" y1="${y}" x2="${W - PAD.r}" y2="${y}" stroke="#eef0f3" stroke-width="1"/>
      <text x="${PAD.l - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#8a919f">${fmtNum(Math.round(v))}</text>`;
  }).join('');
  const labelEvery = Math.max(1, Math.ceil(rows.length / 6));
  const xTicks = rows.map((r, i) => i % labelEvery === 0
    ? `<text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#8a919f">${granularity === 'hour' ? (r.day || '').slice(11) : (r.day || '').slice(5)}</text>`
    : '').join('');
  const dataRows = rows;
  // 每个点的 hover 命中竖条 + 圆点标记（悬停显示该时间点具体用量）
  const hits = dataRows.map((r, i) => {
    const x = X(i);
    return `<g class="ch-hit" data-i="${i}"><rect x="${(x - Math.max(3, step / 2)).toFixed(1)}" y="${PAD.t}" width="${Math.max(6, step).toFixed(1)}" height="${ih}" fill="transparent"/><line x1="${x.toFixed(1)}" y1="${PAD.t}" x2="${x.toFixed(1)}" y2="${PAD.t + ih}" stroke="transparent" stroke-width="1"/></g>`;
  }).join('');
  const dots = series.map(ser => dataRows.map((r, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(r[ser.key] || 0).toFixed(1)}" r="2.5" fill="${ser.color}" opacity="0">`).join('')).join('');
  el.innerHTML = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${yTicks}${lines}${xTicks}${hits}${dots}
  </svg>`;
  // hover 交互：tooltip 跟随 + 高亮该列圆点
  document.querySelectorAll('.chart-tip').forEach(t => t.remove());   // 防重复渲染堆积
  const tip = document.createElement('div');
  tip.className = 'chart-tip';
  document.body.appendChild(tip);
  const show = (i, ev) => {
    const r = dataRows[i];
    if (!r) return;
    tip.style.display = 'block';
    tip.innerHTML = `<b>${r.day}</b><br>请求 ${fmtNum(r.calls)}（成功 ${fmtNum(r.ok)}）<br>总 Token ${fmtNum(r.tokens)}<br>输入 ${fmtNum(r.input)} · 输出 ${fmtNum(r.output)}<br>缓存 ${fmtNum(r.cached)} · 平均 ${fmtDur(r.avgMs)}`;
    const pad = 14;
    let tx = ev.clientX + pad, ty = ev.clientY + pad;
    if (tx + tip.offsetWidth > innerWidth - 8) tx = ev.clientX - tip.offsetWidth - pad;
    if (ty + tip.offsetHeight > innerHeight - 8) ty = ev.clientY - tip.offsetHeight - pad;
    tip.style.left = tx + 'px'; tip.style.top = ty + 'px';
    svg.querySelectorAll('circle').forEach(c => { c.setAttribute('opacity', '0'); });
    series.forEach((ser, si) => {
      const c = svg.querySelectorAll('circle');
      const base = dataRows.length * si + i;
      if (c[base]) c[base].setAttribute('opacity', '1');
    });
  };
  const hide = () => { tip.style.display = 'none'; svg.querySelectorAll('circle').forEach(c => c.setAttribute('opacity', '0')); };
  const svg = el.querySelector('svg');
  svg.querySelectorAll('.ch-hit').forEach(g => {
    g.addEventListener('mousemove', e => show(Number(g.dataset.i), e));
    g.addEventListener('mouseleave', hide);
  });
}

function acModelRow(requestName, upstreamName, type) {
  const KIND_OPTS = [['', '自动'], ['text', '文本'], ['image', '生图'], ['embedding', '向量'], ['rerank', '重排']];
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input class="mr_req" value="${esc(requestName)}" style="min-width:180px"></td>
    <td><input class="mr_up" value="${esc(upstreamName)}" style="min-width:180px"></td>

    <td><button type="button" class="link danger" onclick="this.closest('tr').remove()">✕</button></td>`;

function addAcModelRow() {
  const raw = $('#f_newmodel').value.trim();
  if (!raw) return;
  const i = raw.indexOf('=');
  const req = i < 0 ? raw : raw.slice(0, i).trim();
  const up = i < 0 ? raw : raw.slice(i + 1).trim();
  if ($$('#f_model_tbody .mr_req').some(x => x.value.trim() === req)) { toast('该请求名已存在', 'err'); return; }
  // 新增行按名称预填类别（与后端推断一致），用户可改
  const n = req.toLowerCase();
  const t = /(rerank|bge-reranker)/.test(n) ? 'rerank' : /(embed|bge-m3|gte-|e5-|jina-embed)/.test(n) ? 'embedding' : /(image|flux|sd3|cogview|dall-e|wanx|seedream)/.test(n) ? 'image' : 'text';
  acModelRow(req, up || req, t);
  $('#f_newmodel').value = '';
}
async function discoverModels(id) {
  if (!id) { toast('请先保存账号后再发现模型', 'err'); return; }
  toast('正在从上游拉取模型列表…');
  try {
    const r = await api('GET', '/admin/upstream-accounts/discover-models?accountId=' + id);
    const existing = new Set($$('#f_model_tbody .mr_req').map(x => x.value.trim()));
    let added = 0;
    for (const m of r.models || []) {
      if (existing.has(m)) continue;
      const n = m.toLowerCase();
      const t = /(rerank|bge-reranker)/.test(n) ? 'rerank' : /(embed|bge-m3|gte-|e5-|jina-embed)/.test(n) ? 'embedding' : /(image|flux|sd3|cogview|dall-e|wanx|seedream)/.test(n) ? 'image' : 'text';
      acModelRow(m, m, t);
      existing.add(m); added++;
    }
    toast(`发现 ${r.models?.length || 0} 个模型，新增 ${added} 行`, 'ok');
  } catch (e) { toast('发现失败：' + e.message, 'err'); }
}
async function saveAccount(id) {
  const models = $$('#f_model_tbody tr').map(tr => ({
    requestModelName: tr.querySelector('.mr_req').value.trim(),
    upstreamModelName: tr.querySelector('.mr_up').value.trim() || tr.querySelector('.mr_req').value.trim(),
    modelType: tr.querySelector('.mr_type').value,
  })).filter(m => m.requestModelName);
  const provSel = $('#f_provider').value;
  const provider = provSel === 'custom'
    ? (($('#f_custom_provider')?.value || '').trim() || 'custom')
    : provSel;
  const body = {
    name: $('#f_name').value.trim(), provider, protocolType: $('#f_ptype').value,
    serviceBaseURL: $('#f_url').value.trim(), priority: Number($('#f_priority').value || 0),
    maxConcurrency: Number($('#f_conc').value || 0), validationModel: $('#f_valmodel').value.trim(),
    note: $('#f_note').value, models, protocol: $('#f_proto').value,
  };
  const cred = $('#f_cred').value;
  if (cred) body.credential = cred;
  try {
    await (id ? api('PUT', `/admin/upstream-accounts/${id}`, body) : api('POST', '/admin/upstream-accounts', body));
    closeDrawer(); toast('已保存', 'ok'); state.view = 'accounts'; render();
  } catch (e) { toast(e.message, 'err'); }
}

async function saveModel(origName) {

  const isVirtual = $('#md_virtual')?.checked;
  try {
    if (isVirtual) {
      // 虚拟模型：无上游映射，用 smart-route 接口注册（enabled + 既有规则保留）
      const existing = window._allModels.find(x => x.name === (origName || name));
      await api('PUT', '/admin/models/' + encodeURIComponent(origName || name) + '/smart-route',
        { enabled: true, rules: existing?.rules || [], defaultModel: existing?.defaultModel || '' });
      closeDrawer(); toast(`已保存虚拟模型 ${name}——到智能路由配规则`, 'ok'); render();
      return;
    }
    const mappings = [...$('#mp_body').rows].map(tr => ({
      accountId: Number(tr.querySelector('.mp_acct').value),
      upstreamModel: tr.querySelector('.mp_up').value.trim(),
      modelType: tr.querySelector('.mp_type').value,
    })).filter(mp => mp.upstreamModel);
    if (!mappings.length) { toast('至少一条上游映射（或勾选虚拟模型）', 'err'); return; }
    if (origName) await api('PUT', '/admin/models/' + encodeURIComponent(origName), { name, mappings });
    else await api('POST', '/admin/models', { name, mappings });
    closeDrawer(); toast(`已保存模型 ${name}（${mappings.length} 条映射）`, 'ok'); render();
  } catch (e) { toast(e.message, 'err'); }
}

async function saveJev() {
  try {
    const targets = [];
    for (let i = 0; i < window._jevTargets.length; i++) {
      const el = (s) => document.getElementById(s + '_' + i);
      if (!el('jt_name')) continue;
      const name = el('jt_name').value.trim();
      if (!name) continue;
      targets.push({ id: 't' + (i + 1), name, model: el('jt_model').value, appliesTo: el('jt_applies').value.trim(), notFor: el('jt_notfor').value.trim(), examples: [] });
    }
    if (!targets.length) return toast('至少需要一个路由类别', 'err');
    const r = await api('GET', '/admin/routing');
    r.jev = { ...r.jev, enabled: $('#jev_enabled').value === '1', endpoint: $('#jev_endpoint').value.trim(), targets, fallbackModel: $('#jev_fallback').value, minimumMargin: Number($('#jev_margin').value || 0.1) };

    closeDrawer(); toast('JEV 配置已保存' + (r.jev.enabled ? '，已启用' : '（未启用）'), 'ok'); render();
  } catch (e) { toast(e.message, 'err'); }
}

// 通用分页器：r = {total, page, pageSize}，kind 驱动 gotoPage 分发
function pager(r, kind) {
  if (!r) return '';
  const pages = Math.ceil(r.total / r.pageSize) || 1;
  if (pages <= 1) return `<div class="pager"><span>共 ${r.total} 项</span></div>`;
  const cur = Number(r.page) || 1;
  const nums = [];
  for (let i = Math.max(1, cur - 2); i <= Math.min(pages, cur + 2); i++) nums.push(i);
  return `<div class="pager"><span>共 ${r.total} 项 · 第 ${cur}/${pages} 页</span><div class="pages">
    <button onclick="gotoPage('${kind}',1)" ${cur === 1 ? 'disabled' : ''}>«</button>
    ${nums.map(n => `<button class="${n === cur ? 'active' : ''}" onclick="gotoPage('${kind}',${n})">${n}</button>`).join('')}
    <button onclick="gotoPage('${kind}',${pages})" ${cur === pages ? 'disabled' : ''}>»</button></div></div>`;
}
function gotoPage(kind, page) {
  if (kind === 'logs') logPage(page);
  else if (kind === 'samples') samplePage(page);
  else if (kind === 'decisions') decPage(page);
}

// 调用日志详情：显示当次智能路由决策
async function loadLogDecision(requestId) {
  const box = $('#logDecision');
  if (!box) return;
  try {
    const r = await api('GET', '/admin/smart-routing/decision-logs?pageSize=5&keyword=' + encodeURIComponent(String(requestId).slice(0, 13)));
    const d = r.logs?.[0];
    if (!d) { box.closest('.card-head')?.remove(); box.remove(); return; }
    box.innerHTML = `<table style="margin:0">
      <tr><td class="muted" style="width:120px">请求模型</td><td><b>${esc(d.request_model || '-')}</b></td></tr>
      <tr><td class="muted">路由标签</td><td><span class="tag ${d.route_label === 'simple' ? 't-ok' : d.route_label === 'complex' ? 't-blue' : 't-warn'}">${esc(d.route_label)}</span> · 置信度 ${(Number(d.confidence) || 0).toFixed(2)}</td></tr>
      <tr><td class="muted">选中模型</td><td><b>${esc(d.selected_model)}</b></td></tr>
      <tr><td class="muted">决策来源</td><td class="muted">${esc(d.decision_source)}</td></tr>
    </table>`;
  } catch { box.closest('.card-head')?.remove(); box.remove(); }
}
// 从 ES 取回该次调用的请求/响应正文（mapping 里正文不建索引，按 request_id 精确查）
async function loadLogBodies(requestId) {
  const box = $('#logBodies'), st = $('#bodyStatus');
  if (!box) return;
  const rid = String(requestId || '').replace(/-/g, '').slice(0, 32);
  try {
    const r = await api('GET', '/admin/body-audit/search?requestId=' + encodeURIComponent(rid) + '&days=30&size=5');
    // 历史版本存在一次调用双写（请求/响应各一条）的残缺文档，优先取两段正文都齐的那条
    const hit = r.hits?.find(h => h.request_present || h.response_present) || r.hits?.[0];
    if (!hit) { st.textContent = 'ES 中无该次调用的正文记录（可能审计未开启或已过保留期）'; box.innerHTML = ''; return; }
    const d = await api('GET', '/admin/body-audit/doc?id=' + encodeURIComponent(hit.id) + '&index=' + encodeURIComponent(hit.index || ''));
    st.textContent = `来源 Elasticsearch · 请求 ${d.request_stored_bytes ?? 0}B${d.request_truncated ? '（截断）' : ''} · 响应 ${d.response_stored_bytes ?? 0}B${d.response_truncated ? '（截断）' : ''}`;
    box.innerHTML = `
      <label class="field"><span>请求正文</span>
        <textarea rows="9" readonly style="font-family:ui-monospace,monospace;font-size:11px;max-height:320px;min-height:80px;resize:vertical">${esc(d.request_body_raw || '（未捕获）')}</textarea></label>
      <label class="field"><span>响应正文</span>
        <textarea rows="9" readonly style="font-family:ui-monospace,monospace;font-size:11px;max-height:320px;min-height:80px;resize:vertical">${esc(d.response_body_raw || '（未捕获）')}</textarea></label>`;
  } catch (e) {
    st.textContent = '无法从 ES 读取正文：' + e.message;
    box.innerHTML = '';
  }
}

}
async function toggleProtoConv(on) {
  try { await api('PUT', '/admin/settings', { protocol_conversion: on }); toast(on ? '协议转换已开启（原生优先，转换兜底）' : '协议转换已关闭（仅原生账号）', 'ok'); }
  catch (e) { toast(e.message, 'err'); }
}
async function savePerfSettings() {
  const body = { max_body_mb: Number($('#pf_body').value || 32), stream_idle_sec: Number($('#pf_idle').value || 600), request_timeout_sec: Number($('#pf_timeout').value || 1800), max_concurrency: Number($('#pf_conc').value || 0), stream_first_byte_timeout_sec: Number($('#pf_ttfb').value || 180) };
  try { await api('PUT', '/admin/settings/performance', body); toast('性能设置已保存（部分项重启后完全生效）', 'ok'); } catch (e) { toast(e.message, 'err'); }
}
async function saveHealthSettings() {
  const body = { quotaLatchSec: Number($('#hp_quota').value || 1800), cooldownBaseSec: Number($('#hp_cool').value || 60), errorFails: Number($('#hp_fails').value || 3) };
  try { await api('PUT', '/admin/settings/health_policy', body); toast('健康策略已保存', 'ok'); } catch (e) { toast(e.message, 'err'); }
}
async function changePassword() {
  try { await api('POST', '/admin/me/password', { oldPassword: $('#pw_old').value, newPassword: $('#pw_new').value }); toast('密码已修改', 'ok'); }
  catch (e) { toast(e.message === 'old_password_invalid' ? '原密码不正确' : e.message, 'err'); }
}

/* 启动 */
(async () => {
  try {
    const cur = await fetch('/api/v1/auth/current', { credentials: 'same-origin' }).then(r => r.json());
    if (!cur.user) { state.user = null; render(); return; }
    state.user = cur.user; state.csrf = cur.csrf || '';
    render();
  } catch { state.user = null; render(); }
})();
</script>
</body>
</html>
